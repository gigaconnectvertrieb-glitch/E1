services:
  - type: web
    name: e1-direktvertrieb
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: E1_ADMIN_TOKEN
        generateValue: true
      - key: TG_PORTAL_URL
        value: https://vertriebspartner.teamgermany.de
      - key: TG_PORTAL_USER
        sync: false
      - key: TG_PORTAL_PASS
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
